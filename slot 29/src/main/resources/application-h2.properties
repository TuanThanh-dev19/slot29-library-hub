# Optional H2 demo: --spring.profiles.active=h2,demo
spring.datasource.url=jdbc:h2:mem:librarydb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
