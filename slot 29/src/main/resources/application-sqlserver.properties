# Author: Phan Tuan Thanh
# Default: Windows Authentication on local SQL2022, TCP port 1433.
# Install the native authentication DLL with setup-windows-auth.ps1.
# Run sql/setup-sqlserver.sql in SSMS before starting the application.
spring.datasource.url=${LIBRARY_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Slot29LibraryDB;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dbo
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
